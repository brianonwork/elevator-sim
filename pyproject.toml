[project]
name = "elevator-sim"
version = "0.1.0"
description = "Discrete-time destination-dispatch elevator simulation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
elevator-sim = "elevator_sim.cli:main"
elevator-trials = "elevator_sim.trials.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.4.0",
    "matplotlib>=3.9",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elevator_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 10

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]

[tool.ruff.lint.per-file-ignores]
# Docstring rules cover src/ only; tests document themselves through their names.
"tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
